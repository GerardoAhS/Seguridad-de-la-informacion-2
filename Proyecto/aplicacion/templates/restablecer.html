{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<div class="tarjeta angosta"><h1>Nueva contraseña</h1>
<form method="post">{{ csrf() }}
